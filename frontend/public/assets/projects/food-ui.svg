<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="foodOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#f97316" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#foodBg)"/>
  <circle cx="720" cy="90" r="150" fill="#f97316" fill-opacity="0.08"/>

  <!-- Left Info -->
  <g transform="translate(60, 100)">
    <rect width="110" height="28" rx="14" fill="#f97316" fill-opacity="0.2"/>
    <text x="55" y="19" fill="#f97316" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle">FIGMA • PROTOTYPE</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Food Ordering</text>
    <text x="0" y="120" fill="#f97316" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Mobile Experience</text>
    
    <text x="0" y="170" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">
      <tspan x="0" dy="0">Hyper-local food discovery, real-time driver</tspan>
      <tspan x="0" dy="24">GPS tracking, and customized dietary filters.</tspan>
    </text>

    <!-- Tech tags -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#27272a" stroke="#f97316" stroke-width="1"/>
      <text x="40" y="19" fill="#fed7aa" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="110" height="30" rx="15" fill="#27272a" stroke="#f97316" stroke-width="1"/>
      <text x="145" y="19" fill="#fed7aa" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Design System</text>

      <rect x="210" y="0" width="105" height="30" rx="15" fill="#27272a" stroke="#f97316" stroke-width="1"/>
      <text x="262.5" y="19" fill="#fed7aa" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">UX Research</text>
    </g>
  </g>

  <!-- Right Phone Frame -->
  <g transform="translate(480, 50)" filter="url(#phoneShadow)">
    <rect width="250" height="410" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="6"/>
    <rect x="8" y="8" width="234" height="394" rx="30" fill="#09090b"/>
    <rect x="85" y="14" width="80" height="18" rx="9" fill="#18181b"/>

    <text x="30" y="65" fill="#a1a1aa" font-family="'Outfit', sans-serif" font-size="11">Deliver To</text>
    <text x="30" y="82" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">Velachery, Chennai 🛵</text>

    <!-- Category Pills -->
    <rect x="25" y="105" width="60" height="32" rx="16" fill="url(#foodOrange)"/>
    <text x="55" y="125" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" text-anchor="middle">🍔 All</text>

    <rect x="92" y="105" width="60" height="32" rx="16" fill="#27272a"/>
    <text x="122" y="125" fill="#a1a1aa" font-family="'Outfit', sans-serif" font-size="11" text-anchor="middle">🍕 Pizza</text>

    <rect x="159" y="105" width="65" height="32" rx="16" fill="#27272a"/>
    <text x="191" y="125" fill="#a1a1aa" font-family="'Outfit', sans-serif" font-size="11" text-anchor="middle">🥗 Healthy</text>

    <!-- Food Item Card 1 -->
    <rect x="25" y="155" width="200" height="105" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect x="35" y="165" width="65" height="65" rx="10" fill="#27272a"/>
    <text x="67" y="208" font-size="28" text-anchor="middle">🍔</text>
    <text x="110" y="185" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">Artisan Burger</text>
    <text x="110" y="202" fill="#f97316" font-family="'Outfit', sans-serif" font-size="11">⭐ 4.9 (1.2k+)</text>
    <text x="110" y="222" fill="#e4e4e7" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">$ 9.99</text>

    <!-- Food Item Card 2 -->
    <rect x="25" y="275" width="200" height="105" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <rect x="35" y="285" width="65" height="65" rx="10" fill="#27272a"/>
    <text x="67" y="328" font-size="28" text-anchor="middle">🍜</text>
    <text x="110" y="305" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">Spicy Ramen</text>
    <text x="110" y="322" fill="#f97316" font-family="'Outfit', sans-serif" font-size="11">⭐ 4.8 (850)</text>
    <text x="110" y="342" fill="#e4e4e7" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">$ 11.50</text>
  </g>
</svg>
