<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="webShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#06b6d4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#webBg)"/>

  <!-- Left Info -->
  <g transform="translate(60, 90)">
    <rect width="130" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="65" y="19" fill="#22d3ee" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle">FULL-STACK • MERN</text>
    
    <text x="0" y="75" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Food Delivery</text>
    <text x="0" y="115" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Web Application</text>
    
    <text x="0" y="160" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">
      <tspan x="0" dy="0">Complete dynamic application with React, Express,</tspan>
      <tspan x="0" dy="24">Node.js, and MongoDB. Includes cart persistence,</tspan>
      <tspan x="0" dy="48">live tracking, and full admin order dashboard.</tspan>
    </text>

    <!-- Tech tags -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="75" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="37.5" y="19" fill="#cffafe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">React</text>

      <rect x="85" y="0" width="85" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="127.5" y="19" fill="#cffafe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Node.js</text>

      <rect x="180" y="0" width="95" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="227.5" y="19" fill="#cffafe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Right: Web Browser Interface Mockup -->
  <g transform="translate(420, 60)" filter="url(#webShadow)">
    <rect width="340" height="380" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="340" height="34" rx="14" fill="#1e293b"/>
    <circle cx="18" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="32" cy="17" r="4.5" fill="#eab308"/>
    <circle cx="46" cy="17" r="4.5" fill="#22c55e"/>
    <rect x="75" y="7" width="190" height="20" rx="10" fill="#0f172a"/>
    <text x="170" y="21" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">localhost:5173/delivery</text>

    <!-- App Header inside Mockup -->
    <rect x="15" y="48" width="310" height="32" rx="8" fill="#1e293b"/>
    <text x="28" y="69" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">FoodExpress</text>
    <rect x="260" y="53" width="55" height="22" rx="11" fill="url(#cyanGrad)"/>
    <text x="287.5" y="68" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Cart (3)</text>

    <!-- Content: 2 Columns (Menu + Order Summary) -->
    <!-- Menu items -->
    <rect x="15" y="90" width="190" height="70" rx="8" fill="#1e293b"/>
    <text x="25" y="112" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Crispy Chicken Bowl</text>
    <text x="25" y="128" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Basmati rice, garlic aioli</text>
    <text x="25" y="148" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">$12.50</text>
    <rect x="160" y="128" width="35" height="22" rx="6" fill="#0284c7"/>
    <text x="177.5" y="143" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">+ Add</text>

    <rect x="15" y="168" width="190" height="70" rx="8" fill="#1e293b"/>
    <text x="25" y="190" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Paneer Tikka Roll</text>
    <text x="25" y="206" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Mint chutney, onion relish</text>
    <text x="25" y="226" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">$9.00</text>
    <rect x="160" y="206" width="35" height="22" rx="6" fill="#0284c7"/>
    <text x="177.5" y="221" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">+ Add</text>

    <!-- Side Cart Panel -->
    <rect x="215" y="90" width="110" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="225" y="112" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">Order Summary</text>
    <text x="225" y="132" fill="#94a3b8" font-size="9">1x Crispy Bowl</text>
    <text x="225" y="150" fill="#94a3b8" font-size="9">2x Paneer Roll</text>
    <line x1="225" y1="165" x2="315" y2="165" stroke="#334155"/>
    <text x="225" y="185" fill="#f8fafc" font-size="10" font-weight="bold">Total: $30.50</text>
    <rect x="225" y="200" width="90" height="26" rx="6" fill="url(#cyanGrad)"/>
    <text x="270" y="217" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Checkout</text>
  </g>
</svg>
