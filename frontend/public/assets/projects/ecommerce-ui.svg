<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ecomBg)"/>

  <!-- Left Info -->
  <g transform="translate(60, 100)">
    <rect width="110" height="28" rx="14" fill="#6366f1" fill-opacity="0.2"/>
    <text x="55" y="19" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle">FIGMA • WEB UI</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">E-Commerce</text>
    <text x="0" y="120" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Website Design</text>
    
    <text x="0" y="170" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">
      <tspan x="0" dy="0">Modern luxury aesthetics, dynamic multi-facet</tspan>
      <tspan x="0" dy="24">filtering, and frictionless conversion checkout.</tspan>
    </text>

    <!-- Tech tags -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text x="40" y="19" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="90" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text x="135" y="19" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Responsive</text>

      <rect x="190" y="0" width="110" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text x="245" y="19" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Wireframing</text>
    </g>
  </g>

  <!-- Right: Browser Window Mockup -->
  <g transform="translate(420, 60)" filter="url(#glow)">
    <!-- Browser chrome -->
    <rect width="340" height="380" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Top Bar -->
    <rect width="340" height="36" rx="16" fill="#0f172a"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#eab308"/>
    <circle cx="52" cy="18" r="5" fill="#22c55e"/>
    
    <rect x="80" y="8" width="180" height="20" rx="10" fill="#1e293b"/>
    <text x="170" y="22" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">luxurystore.design</text>

    <!-- Web Content: Hero Banner -->
    <rect x="16" y="52" width="308" height="110" rx="10" fill="url(#purpleGlow)"/>
    <text x="32" y="86" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">Summer Drop 2026</text>
    <text x="32" y="105" fill="#e0e7ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Exclusive Designer Collections</text>
    <rect x="32" y="120" width="85" height="26" rx="13" fill="#ffffff"/>
    <text x="74.5" y="137" fill="#4338ca" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Explore Now</text>

    <!-- Product Grid -->
    <rect x="16" y="176" width="148" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="26" y="186" width="128" height="85" rx="8" fill="#1e293b"/>
    <text x="90" y="235" font-size="32" text-anchor="middle">👟</text>
    <text x="26" y="290" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">Aero Stride 90</text>
    <text x="26" y="306" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Streetwear Edition</text>
    <text x="26" y="330" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">$ 149.00</text>

    <rect x="176" y="176" width="148" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="186" y="186" width="128" height="85" rx="8" fill="#1e293b"/>
    <text x="250" y="235" font-size="32" text-anchor="middle">🎧</text>
    <text x="186" y="290" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">Sonic Pro Wireless</text>
    <text x="186" y="306" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Active Noise Cancel</text>
    <text x="186" y="330" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">$ 229.00</text>
  </g>
</svg>
