<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="mailShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#newsBg)"/>

  <!-- Left Info -->
  <g transform="translate(60, 100)">
    <rect width="110" height="28" rx="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="55" y="19" fill="#34d399" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle">FIGMA • LAYOUT</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Email Newsletter</text>
    <text x="0" y="120" fill="#34d399" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">Visual Design</text>
    
    <text x="0" y="170" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">
      <tspan x="0" dy="0">High-converting editorial layout, modular blocks,</tspan>
      <tspan x="0" dy="24">and responsive mobile-first email templates.</tspan>
    </text>

    <!-- Tech tags -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="40" y="19" fill="#d1fae5" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="105" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="142.5" y="19" fill="#d1fae5" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Email UI/UX</text>

      <rect x="205" y="0" width="100" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="255" y="19" fill="#d1fae5" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Typography</text>
    </g>
  </g>

  <!-- Right: Email Client Mockup -->
  <g transform="translate(450, 50)" filter="url(#mailShadow)">
    <rect width="290" height="400" rx="14" fill="#ffffff"/>
    
    <!-- Email Header -->
    <rect width="290" height="60" rx="14" fill="#0f172a"/>
    <text x="25" y="36" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">TECH HORIZON</text>
    <text x="25" y="50" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Weekly Digest • Issue #42</text>
    
    <!-- Hero article image -->
    <rect x="20" y="75" width="250" height="120" rx="8" fill="#10b981"/>
    <text x="145" y="140" fill="#ffffff" font-size="40" text-anchor="middle">🚀</text>

    <!-- Headline -->
    <text x="20" y="215" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">The Rise of Autonomous AI Agents</text>
    <text x="20" y="235" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">
      <tspan x="20" dy="0">Discover how next-gen intelligent agents</tspan>
      <tspan x="20" dy="16">are revolutionizing modern engineering.</tspan>
    </text>

    <!-- CTA Button -->
    <rect x="20" y="275" width="130" height="32" rx="16" fill="#059669"/>
    <text x="85" y="295" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Read Full Story →</text>

    <!-- Mini article -->
    <line x1="20" y1="325" x2="270" y2="325" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="20" y="338" width="45" height="45" rx="6" fill="#f1f5f9"/>
    <text x="42.5" y="365" font-size="20" text-anchor="middle">💡</text>
    <text x="75" y="355" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">5 UI/UX Principles for 2026</text>
    <text x="75" y="372" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Micro-animations and tactile feedback...</text>
  </g>
</svg>
